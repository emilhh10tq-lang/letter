<script>

let count = 0;

function startLove(){
    document.getElementById("start").style.display="none";
    document.getElementById("love").style.display="block";
}

function runAway(){

    noLove();

    const no = document.getElementById("no");

    const x = Math.random() * (window.innerWidth - 100);
    const y = Math.random() * (window.innerHeight - 50);

    no.style.position = "fixed";
    no.style.left = x + "px";
    no.style.top = y + "px";
}

function noLove(){

    count++;

    let yes = document.getElementById("yes");
    let no = document.getElementById("no");
    let q = document.getElementById("question");

    yes.style.fontSize = (20 + count*15) + "px";

    no.style.fontSize = Math.max(1, 18 - count*4) + "px";
    no.style.padding =
        Math.max(1,12-count*2) + "px " +
        Math.max(1,25-count*5) + "px";

    if(count==1){
        q.innerText="잘 생각해봐! 😳";
    }

    else if(count==2){
        q.innerText="눈치껏 하자 😡";
    }

    else if(count==3){
        q.innerText="진짜...? 😭";
    }

    else if(count==4){
        q.innerText="그만 눌러!!! 😤";
    }

    else if(count>=5){
        q.innerText="이제 응 눌러 😎";
        no.style.fontSize="2px";
        no.style.padding="1px 2px";
    }
}

function yesLove(){

    document.getElementById("box").innerHTML=`

    <h1>💖 나두 사랑해!! 💖</h1>

    <h3>
    히히 😆💕
    </h3>

    `;
}

</script>
