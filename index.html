<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💖</title>

<style>
body{
    margin:0;
    background:#ffd6e7;
    font-family:sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    text-align:center;
}

#box{
    padding:20px;
}

button{
    border:none;
    border-radius:15px;
    padding:12px 25px;
    margin:10px;
    cursor:pointer;
    font-size:18px;
}

#yes{
    background:#ff6ba5;
    color:white;
    font-size:20px;
}

#no{
    background:white;
}

.heart{
    font-size:100px;
    cursor:pointer;
}
</style>
</head>

<body>

<div id="box">

<div id="start">
    <div class="heart" onclick="startLove()">💖</div>
    <h2>하트 눌러바</h2>
</div>

<div id="love" style="display:none;">
    <h2 id="question">나 사랑하지? 🥺</h2>

    <button id="yes" onclick="yesLove()">응!!</button>
    <button id="no" onclick="noLove()">아니</button>
</div>

</div>

<script>
let count = 0;

function startLove(){
    document.getElementById("start").style.display="none";
    document.getElementById("love").style.display="block";
}

function noLove(){
    count++;

    const yesBtn = document.getElementById("yes");
    yesBtn.style.fontSize = (20 + count*10) + "px";

    if(count==1){
        document.getElementById("question").innerText =
        "잘 생각해봐! 😳";
    }

    else if(count==2){
        document.getElementById("question").innerText =
        "눈치껏 하자! 😡";
    }

    else if(count==3){
        document.getElementById("question").innerText =
        "진짜 마지막 기회야; ";
    }

    else{
        document.getElementById("no").style.display="none";
    }
}

function yesLove(){
    document.getElementById("box").innerHTML = `
    <h1>💖 나두 사랑해!! 💖</h1>
    <p>히히 😆</p>
    `;
}
</script>

</body>
</html>
